name: Dependent Jobs Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Build Application
        run: echo "Building application..."

      - name: Build Finished
        run: sleep 5

  test:
    name: Test Job
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Run Test Cases
        run: echo "Running tests..."

      - name: Test Process Complete
        run: sleep 5

  deploy:
    name: Deploy Job
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Application
        run: echo "Deploying application..."

      - name: Deployment Complete
        run: sleep 5
